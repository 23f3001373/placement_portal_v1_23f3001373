{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-dark">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="card-title m-0">Edit Profile</h4>
                    <a href="{{ url_for('student_dashboard') }}" class="btn btn-sm btn-outline-secondary">Back</a>
                </div>
                
                <form method="POST" action="{{ url_for('edit_profile') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="name" class="form-label small mb-0">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ current_user.name }}" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="department" class="form-label small mb-0">Department</label>
                        <input type="text" class="form-control" id="department" name="department" value="{{ current_user.department }}" required>
                    </div>
                    
                    <h6 class="text-muted border-bottom pb-2">Resume Upload</h6>
                    <div class="mb-4">
                        {% if current_user.resume_filename %}
                            <p class="small text-success mb-1">Current File: {{ current_user.resume_filename }}</p>
                        {% endif %}
                        <label for="resume" class="form-label small mb-0">Upload New Resume (PDF preferred)</label>
                        <input type="file" class="form-control" id="resume" name="resume" accept=".pdf,.doc,.docx">
                    </div>
                    
                    <div class="text-end">
                        <button type="submit" class="btn btn-outline-success">Save Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
