{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-dark">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="card-title m-0">Edit {{ user.role | capitalize }}</h4>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-sm btn-outline-secondary">Back</a>
                </div>
                
                <form method="POST" action="{{ url_for('admin_edit_user', user_id=user.id) }}">
                    <div class="mb-3">
                        <label class="form-label small text-muted mb-0">Username (Cannot be changed)</label>
                        <input type="text" class="form-control bg-light" value="{{ user.username }}" disabled>
                    </div>

                    {% if user.role == 'student' %}
                    <div class="mb-3">
                        <label for="name" class="form-label small mb-0">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                    </div>
                    <div class="mb-4">
                        <label for="department" class="form-label small mb-0">Department</label>
                        <input type="text" class="form-control" id="department" name="department" value="{{ user.department }}" required>
                    </div>
                    {% elif user.role == 'company' %}
                    <div class="mb-3">
                        <label for="company_name" class="form-label small mb-0">Company Name</label>
                        <input type="text" class="form-control" id="company_name" name="company_name" value="{{ user.company_name }}" required>
                    </div>
                    <div class="mb-4">
                        <label for="hr_contact" class="form-label small mb-0">HR Contact</label>
                        <input type="text" class="form-control" id="hr_contact" name="hr_contact" value="{{ user.hr_contact }}" required>
                    </div>
                    {% endif %}
                    
                    <div class="text-end">
                        <button type="submit" class="btn btn-outline-success">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
