{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-md-8">
        <div class="card shadow-sm border-dark">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="card-title m-0">Edit Drive</h4>
                    <a href="{{ url_for('company_dashboard') }}" class="btn btn-sm btn-outline-secondary">Back</a>
                </div>
                
                <form method="POST" action="{{ url_for('edit_drive', drive_id=drive.id) }}">
                    <div class="mb-3">
                        <label for="job_title" class="form-label small mb-0">Job Title</label>
                        <input type="text" class="form-control" id="job_title" name="job_title" value="{{ drive.job_title }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="job_description" class="form-label small mb-0">Job Description</label>
                        <textarea class="form-control" id="job_description" name="job_description" rows="4" required>{{ drive.job_description }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="eligibility_criteria" class="form-label small mb-0">Eligibility Criteria</label>
                        <textarea class="form-control" id="eligibility_criteria" name="eligibility_criteria" rows="2" required>{{ drive.eligibility_criteria }}</textarea>
                    </div>
                    
                    <div class="mb-4">
                        <label for="application_deadline" class="form-label small mb-0">Application Deadline</label>
                        <input type="date" class="form-control" id="application_deadline" name="application_deadline" value="{{ drive.application_deadline }}" required>
                    </div>
                    
                    <div class="text-end">
                        <button type="submit" class="btn btn-outline-success">Update Drive</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
